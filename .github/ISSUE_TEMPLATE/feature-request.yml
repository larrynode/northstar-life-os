name: Feature request
description: Propose a focused improvement with its privacy and compatibility impact.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without including personal records.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this change a trust or compatibility boundary?
      options:
        - No
        - CLI or schema
        - Private vault or encryption
        - Network, accounts, sync, or telemetry
        - Import, export, backup, or restore
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
